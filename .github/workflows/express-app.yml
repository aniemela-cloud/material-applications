name: Release Express App (Exercise 3.1 your pipeline)

on:
    push:
        branches:
            - main
        paths:
            - 'express-app/**'
            - '.github/workflows/express-app.yml'
defaults:
    run:
        working-directory: ./express-app
jobs:
    build:
        name: Build
        runs-on: ubuntu-latest
        steps:
        # Checkout
            - name: Checkout repository for action
              uses: actions/checkout@v6
        
        # Docker build
            - name: Docker setup
              uses: docker/setup-buildx-action@v4

        # Docker login
            - name: Login to Docker Hub
              uses: docker/login-action@v4
              with:
                username: ${{ vars.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}
        # Docker push
            - name: Docker build and push
              uses: docker/build-push-action@v6
              with:
                context: ./express-app
                push: true
                tags: ${{ vars.DOCKERHUB_USERNAME }}/express-app-pipeline:latest

